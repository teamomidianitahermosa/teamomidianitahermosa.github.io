<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Día Hermoso</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="contenedor-principal3">
        <div id="contenedor-colgante-js"></div>

        <div class="cielo-diurno">
            <div class="sol-brillante"></div>
        </div>
        
        <div class="montana-dia montana-izq-dia"></div>
        <div class="montana-dia montana-der-dia"></div>
        
        <div class="forest-row">
            <div class="arbol-corazon a-1"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-2"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-3"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-4"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-6"><div class="copa-corazon"></div><div class="trunk"></div></div>
            <div class="arbol-corazon a-7"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-8"><div class="copa-corazon"></div><div class="tronco"></div></div>
            <div class="arbol-corazon a-9"><div class="copa-corazon"></div><div class="tronco"></div></div>
        </div>

        <div class="suelo-pasto-dia">
            <!-- Lienzo gráfico de alto rendimiento para los tulipanes -->
            <canvas id="canvas-tulipanes"></canvas>
        </div>

        <div class="pareja-parada-junta">
            <div class="silueta-parada-dia persona-izq-dia">
                <div class="cabeza-parada-dia"></div>
                <div class="cuerpo-parada-dia"></div>
            </div>
            
            <div class="gran-corazon-central"></div>
            
            <div class="silueta-parada-dia persona-der-dia">
                <div class="cabeza-parada-dia"></div>
                <div class="cuerpo-parada-dia"></div>
            </div>
        </div>
            <!-- 6. Contenedor para el texto sorpresa diferido -->
        <div class="message-container">
            <p id="romantic-text">Me gustaria vivir cada sorpresa y cada posibilidad al lado tuyo.❤️</p>
        </div>

    </div>

    <script src="script3.js"></script>
</body>
</html>
